name: Fuzzy Engine CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile Desktop Simulation
      # Adjust 'main.c' to whatever your simulation file is named. 
      # -lm links the math library for your floating-point shapes.
      run: gcc -DSIMULATION -Wall -Wextra -O2 -o fuzzy_sim controller_8051.c -lm

    - name: Execute Simulation
      run: ./fuzzy_sim

    - name: Upload Plot Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fuzzy-simulation-plots
        path: |
          *.svg
          *.csv
          # Add your specific output directories here if needed
          demo-all/
          braking/
