name: ESP32 CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  esp32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # Install classic ESP32 Xtensa toolchain
      # ============================================================

      - name: Install ESP32 Xtensa toolchain
        shell: bash
        run: |
          set -eux

          ARCHIVE="${RUNNER_TEMP}/esp32-toolchain.tar.xz"
          TOOLCHAIN_ROOT="${RUNNER_TEMP}/esp32-toolchain"

          mkdir -p "${TOOLCHAIN_ROOT}"

          curl -L \
            --retry 3 \
            --connect-timeout 30 \
            -o "${ARCHIVE}" \
            "https://github.com/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/xtensa-esp32-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.xz"

          test -s "${ARCHIVE}"

          tar -xJf "${ARCHIVE}" -C "${TOOLCHAIN_ROOT}"

          GCC="$(find "${TOOLCHAIN_ROOT}" \
            -type f \
            -name "xtensa-esp32-elf-gcc" \
            -print -quit)"

          OBJCOPY="$(find "${TOOLCHAIN_ROOT}" \
            -type f \
            -name "xtensa-esp32-elf-objcopy" \
            -print -quit)"

          SIZE="$(find "${TOOLCHAIN_ROOT}" \
            -type f \
            -name "xtensa-esp32-elf-size" \
            -print -quit)"

          test -x "${GCC}"
          test -x "${OBJCOPY}"
          test -x "${SIZE}"

          TOOLCHAIN_BIN="$(dirname "${GCC}")"

          echo "ESP32 toolchain: ${TOOLCHAIN_BIN}"
          echo "${TOOLCHAIN_BIN}" >> "${GITHUB_PATH}"

      # ============================================================
      # Verify toolchain
      # ============================================================

      - name: Verify ESP32 toolchain
        shell: bash
        run: |
          set -eux

          command -v xtensa-esp32-elf-gcc
          command -v xtensa-esp32-elf-objcopy
          command -v xtensa-esp32-elf-size

          xtensa-esp32-elf-gcc --version
          xtensa-esp32-elf-objcopy --version
          xtensa-esp32-elf-size --version

      # ============================================================
      # ESP32 Makefile workflow
      # ============================================================

      - name: Check ESP32 configuration
        shell: bash
        run: |
          set -eux
          make check-esp32

      - name: Build ESP32 demo
        shell: bash
        run: |
          set -eux
          make esp32-build

      - name: Convert ESP32 ELF to binary
        shell: bash
        run: |
          set -eux
          make esp32-bin

      # ============================================================
      # Validate artifacts
      # ============================================================

      - name: Validate ESP32 artifacts
        shell: bash
        run: |
          set -eux

          test -f "esp32/build/esp32_demo.elf"
          test -f "esp32/build/esp32_demo.bin"

          echo "=== ESP32 artifacts ==="
          find "esp32/build" -maxdepth 1 -type f -print

          echo
          echo "=== ELF ==="
          file "esp32/build/esp32_demo.elf"

          echo
          echo "=== BIN ==="
          file "esp32/build/esp32_demo.bin"

          echo
          echo "=== Size ==="
          xtensa-esp32-elf-size "esp32/build/esp32_demo.elf"
