name: Fuzzy Desktop CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate-desktop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Desktop Toolchains
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gcc \
            make \
            ccache \
            mold \
            librsvg2-bin \
            ocl-icd-opencl-dev \
            opencl-headers \
            clinfo \
            pocl-opencl-icd

      - name: Check Desktop Dependencies
        run: |
          make check-dependencies
          gcc --version
          make --version
          ldd --version
          clinfo --list
          clinfo | grep -E "Platform Name|Platform Vendor|Device Name|Device Type|Device Available|Compiler Available|OpenCL C Version" || true

      - name: Clean Desktop Build
        run: |
          make clean-desktop
          make clean-fuzzy-neuron

          rm -f \
            strength-app \
            greenhouse-app \
            braking-app \
            braking-gpu \
            fuzzy-demo \
            sugeno-app \
            demo-all-gpu \
            sim-8051-app \
            fuzzy-neuron \
            fuzzy_model_rules.so

      - name: Verify Prebuilt Binaries Were Removed
        run: |
          test ! -e strength-app
          test ! -e greenhouse-app
          test ! -e braking-app
          test ! -e braking-gpu
          test ! -e fuzzy-demo
          test ! -e sugeno-app
          test ! -e demo-all-gpu
          test ! -e sim-8051-app
          test ! -e fuzzy-neuron
          test ! -e fuzzy_model_rules.so

      - name: Compile Desktop Simulations
        run: make -j"$(nproc)" desktop

      - name: Verify Desktop Build Outputs
        run: |
          test -x strength-app
          test -x greenhouse-app
          test -x braking-app
          test -x braking-gpu
          test -x fuzzy-demo
          test -x sugeno-app
          test -x demo-all-gpu
          test -x sim-8051-app
          test -x fuzzy-neuron
          test -f fuzzy_model_rules.so
          test -f fuzzy_neuron_kernels.cl

      - name: Verify Runner-Linked Desktop Binaries
        run: |
          file strength-app
          ldd strength-app

          file greenhouse-app
          ldd greenhouse-app

          file braking-app
          ldd braking-app

          file braking-gpu
          ldd braking-gpu

          file fuzzy-demo
          ldd fuzzy-demo

          file sugeno-app
          ldd sugeno-app

          file demo-all-gpu
          ldd demo-all-gpu

          file sim-8051-app
          ldd sim-8051-app

          file fuzzy-neuron
          ldd fuzzy-neuron

          file fuzzy_model_rules.so
          ldd fuzzy_model_rules.so

      - name: Execute Non-Interactive CPU Sweeps
        run: |
          make run-demo
          make run-sugeno
          make run-sim-8051

      - name: Execute Interactive Programs With Mock Inputs
        run: |
          printf '45\n80\n' | make run-strength
          printf '28\n65\n5\n' | make run-greenhouse

      - name: Execute CPU Braking Demonstration
        run: make run-braking

      - name: Verify Generated Sugeno Training Dataset
        run: |
          test -f sugeno/sugeno_complex_sweep.csv
          test -s sugeno/sugeno_complex_sweep.csv
          head -n 5 sugeno/sugeno_complex_sweep.csv
          wc -l sugeno/sugeno_complex_sweep.csv

      - name: Verify OpenCL Applications Were Built
        run: |
          test -x braking-gpu
          test -x demo-all-gpu
          test -x fuzzy-neuron
          test -f fuzzy_model_rules.so
          test -f fuzzy_neuron_kernels.cl

          file braking-gpu
          ldd braking-gpu

          file demo-all-gpu
          ldd demo-all-gpu

          file fuzzy-neuron
          ldd fuzzy-neuron

          file fuzzy_model_rules.so
          ldd fuzzy_model_rules.so

      - name: Report Hosted Runner OpenCL Limitation
        run: |
          echo "OpenCL applications compiled successfully."
          echo "GitHub-hosted ubuntu-latest does not provide the required OpenCL GPU device."
          echo "POCL exposes an OpenCL CPU device."
          echo "The fuzzy.h GPU runtime intentionally requires CL_DEVICE_TYPE_GPU."
          echo "GPU runtime tests are executed by the self-hosted OpenCL GPU workflow."

      - name: Convert SVGs to PNG
        run: |
          make -j"$(nproc)" \
            png-strength \
            png-greenhouse \
            png-braking \
            png-demo \
            png-sugeno \
            png-sim-8051

      - name: Convert SVGs to PDF
        run: |
          make -j"$(nproc)" \
            pdf-strength \
            pdf-greenhouse \
            pdf-braking \
            pdf-demo \
            pdf-sugeno \
            pdf-sim-8051

      - name: List Generated Desktop Artifacts
        if: always()
        run: |
          find \
            strength \
            greenhouse \
            braking \
            demo-all \
            sugeno \
            sim-8051/desktop \
            -maxdepth 3 \
            -type f \
            -print \
            2>/dev/null \
            | sort \
            || true

      - name: Upload Desktop Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzy-desktop-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: |
            strength/
            greenhouse/
            braking/
            demo-all/
            sugeno/
            sim-8051/desktop/
            strength-app
            greenhouse-app
            braking-app
            braking-gpu
            fuzzy-demo
            sugeno-app
            demo-all-gpu
            sim-8051-app
            fuzzy-neuron
            fuzzy_model_rules.so
            fuzzy_neuron_kernels.cl
